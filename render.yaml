# Configuração de deploy no Render (render.com)
# Crie um Web Service apontando para este repositório.
# O Render usará este arquivo para configurar automaticamente.

services:
  - type: web
    name: scipubs-api
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Configure no dashboard do Render
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # Configure no dashboard do Render
      - key: LLM_PROVIDER
        value: gemini
      - key: GROQ_API_KEY
        sync: false  # Opcional
      - key: OPENALEX_EMAIL
        value: scipubs@example.com
    healthCheckPath: /health
